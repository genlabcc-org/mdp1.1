<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 88" fill="none">
  <defs>
    <style>
      .badge-red    { fill: #FF2354; }
      .badge-yellow { fill: #FFCA00; }
      .badge-cyan   { fill: #01CADE; }
    </style>
  </defs>

  <!-- Left '1' -->
  <g id="left-one">
    <!-- Cyan 3D Blocks -->
    <rect class="badge-cyan" x="10" y="36" width="12" height="6" rx="2" />
    <rect class="badge-cyan" x="22" y="74" width="16" height="6" rx="2" />

    <!-- Yellow Dividers -->
    <rect class="badge-yellow" x="10" y="32" width="12" height="4" />
    <rect class="badge-yellow" x="22" y="70" width="16" height="4" />

    <!-- Red Glyph -->
    <path class="badge-red" d="
      M 22,10
      L 36,10
      C 37.2,10 38,10.8 38,12
      L 38,68
      C 38,69.2 37.2,70 36,70
      L 24,70
      C 22.8,70 22,69.2 22,68
      L 22,32
      L 12,32
      C 10.8,32 10,31.2 10,30
      L 10,22
      C 10,20.8 10.6,20 11.8,19.2
      C 16,16.5 19.5,13.5 21,10.8
      C 21.4,10.2 21.7,10 22,10
      Z
    " />
  </g>

  <!-- Period '.' -->
  <g id="period">
    <!-- Cyan 3D Block -->
    <rect class="badge-cyan" x="52" y="74" width="14" height="6" rx="2" />
    <!-- Yellow Divider -->
    <rect class="badge-yellow" x="52" y="70" width="14" height="4" />
    <!-- Red Dot Face -->
    <rect class="badge-red" x="52" y="56" width="14" height="14" rx="2" />
  </g>

  <!-- Right '1' -->
  <g id="right-one">
    <!-- Cyan 3D Blocks -->
    <rect class="badge-cyan" x="80" y="36" width="12" height="6" rx="2" />
    <rect class="badge-cyan" x="92" y="74" width="16" height="6" rx="2" />

    <!-- Yellow Dividers -->
    <rect class="badge-yellow" x="80" y="32" width="12" height="4" />
    <rect class="badge-yellow" x="92" y="70" width="16" height="4" />

    <!-- Red Glyph -->
    <path class="badge-red" d="
      M 92,10
      L 106,10
      C 107.2,10 108,10.8 108,12
      L 108,68
      C 108,69.2 107.2,70 106,70
      L 94,70
      C 92.8,70 92,69.2 92,68
      L 92,32
      L 82,32
      C 80.8,32 80,31.2 80,30
      L 80,22
      C 80,20.8 80.6,20 81.8,19.2
      C 86,16.5 89.5,13.5 91,10.8
      C 91.4,10.2 91.7,10 92,10
      Z
    " />
  </g>
</svg>
